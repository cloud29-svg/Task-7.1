<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Mood Dashboard</title>
</head>
<body>
    <div>
        <input type="text" id="nameInput" placeholder="Enter your name">

        <div id="greeting">Hello, Friend!</div>
    </div>

    <div>
        <div id="moodBox" style="width: 100px; height: 100px; background-color: lightblue; margin: 20px;"></div>

        <button id="growBtn">Grow </button>

        <button id="shrinkBtn">Shrink</button>
    </div>

    <button id="toggleMode">Toggle Day/Night</button>

    <button id="secretBtn">Show Secret</button>
    <div id="secretMessage" style="display: none;">You are amazing! keep coding!</div>

   <script src="script.js"></script>
</body>
</html>
